name: Android CI

on:
  workflow_dispatch:
  push:
    branches-ignore: [ "stable" ]
    paths-ignore:
      - ".idea/"
      - "assets/"
      - "metadata/"
      - "*.md"
      - "LICENSE.txt"
  pull_request:
    paths-ignore:
      - ".idea/"
      - "assets/"
      - "metadata/"
      - "*.md"
      - "LICENSE.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleGithubDebug --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRORS=$(grep -E "^e: |error: |Caused by: " build.log | head -40)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$ERRORS"
          else
            echo "No compile errors matched - tail of build log:"
            tail -80 build.log
          fi
          exit 1

      - name: Find APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/github/debug -name '*.apk' | head -1)
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename "$APK_PATH")" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          archive: false
