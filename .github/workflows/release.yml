name: Build & Release BoomingFlow APK

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p ${{ runner.temp }}/keystore
          echo "$SIGNING_KEY" | base64 --decode > ${{ runner.temp }}/keystore/boomingflow.jks

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          echo "$SIGNING_PROPERTIES" | base64 --decode > temp.properties
          export KEY_ALIAS=$(grep keyAlias temp.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
          export KEY_PASSWORD=$(grep keyPassword temp.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
          export STORE_PASSWORD=$(grep storePassword temp.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
          export KEYSTORE_FILE="${{ runner.temp }}/keystore/boomingflow.jks"
          rm temp.properties
          ./gradlew assembleGithubRelease --no-daemon

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/github/release/BoomingFlow-*.apk
